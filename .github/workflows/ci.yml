name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: system deps
        run: sudo apt-get update && sudo apt-get install -y sqlite3 libsqlite3-dev

      - name: build compiler
        run: cargo build --release --manifest-path lang/Cargo.toml

      - name: run test suite
        run: bash tests/run.sh "$PWD/lang/target/release/lang"

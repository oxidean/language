name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15 pinned: every macos-latest run on this repo sat queued
        # ~15min and was cancelled without acquiring a runner (empty
        # runner_name, zero steps) — the rolling label never schedules.
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: system deps (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y sqlite3 libsqlite3-dev

      - name: build compiler
        run: cargo build --release --manifest-path oxl/Cargo.toml

      - name: run test suite
        run: bash tests/run.sh "$PWD/oxl/target/release/oxl"

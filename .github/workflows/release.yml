name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # build/test steps run dep code; publish uses github.token directly
      - uses: dtolnay/rust-toolchain@stable
      - name: build oxl
        run: cargo build --release --manifest-path oxl/Cargo.toml
      - name: test suite (gate)
        run: bash tests/run.sh ./oxl/target/release/oxl
      - name: package toolchain
        run: |
          mkdir -p dist/oxl-toolchain
          cp oxl/target/release/oxl dist/oxl-toolchain/
          cp -r stdlib dist/oxl-toolchain/
          cp README.md LICENSE dist/oxl-toolchain/
          cd dist && tar czf oxl-toolchain-linux-x86_64.tar.gz oxl-toolchain
      - name: github release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/oxl-toolchain-linux-x86_64.tar.gz
          generate_release_notes: true

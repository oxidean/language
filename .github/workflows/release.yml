name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build lang
        run: cargo build --release --manifest-path lang/Cargo.toml
      - name: test suite (gate)
        run: bash tests/run.sh ./lang/target/release/lang
      - name: package toolchain
        run: |
          mkdir -p dist/lang-toolchain
          cp lang/target/release/lang dist/lang-toolchain/
          cp -r stdlib dist/lang-toolchain/
          cp README.md LICENSE dist/lang-toolchain/
          cd dist && tar czf lang-toolchain-linux-x86_64.tar.gz lang-toolchain
      - name: github release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/lang-toolchain-linux-x86_64.tar.gz
          generate_release_notes: true
